name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p juku-web --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --workspace
      - name: バランス確認（6 戦略 × 5 年 × 8 シード）
        run: cargo run -p juku-sim --example balance --release -- 5 8 | tee balance.txt
      - uses: actions/upload-artifact@v4
        with:
          name: balance-report
          path: balance.txt

  build-windows:
    name: Windows ビルド
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p juku-desktop --release
      - uses: actions/upload-artifact@v4
        with:
          name: yyshop-windows
          path: target/release/yyshop.exe

  build-web:
    name: Web ビルド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen-cli（Cargo.lock と同じ版）と binaryen を入れる
        run: |
          WB_VERSION=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep version | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$WB_VERSION" --locked
          sudo apt-get update && sudo apt-get install -y binaryen
      - run: ./tools/build-web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: yyshop-web
          path: dist
